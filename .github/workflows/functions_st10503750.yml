name: Build and deploy Azure Functions app - st10503750-functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: st10503750-abc-retail-functions
  AZURE_FUNCTIONAPP_PACKAGE_PATH: ABCRetail.Functions
  DOTNET_VERSION: 8.0.x

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/ABCRetail.Functions.csproj"

      - name: Publish
        run: dotnet publish "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/ABCRetail.Functions.csproj" --configuration Release --output "${{ github.workspace }}/publish"

      - name: Verify Azure Functions files
        shell: powershell
        run: |
          Write-Host "Checking publish output..."
          Get-ChildItem "${{ github.workspace }}/publish"
          Write-Host "Checking .azurefunctions..."
          Get-ChildItem "${{ github.workspace }}/publish/.azurefunctions"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-app
          path: ./publish

      - name: Verify downloaded artifact
        shell: powershell
        run: |
          Write-Host "Checking downloaded deployment files..."
          Get-ChildItem -Force ./publish
          Write-Host "Checking .azurefunctions..."
          Get-ChildItem -Force ./publish/.azurefunctions

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}